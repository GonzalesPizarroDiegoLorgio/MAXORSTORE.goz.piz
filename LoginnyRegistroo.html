<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login y Registro</title>
    <link rel="stylesheet" href="css/LoginyRegistro.css">
  
</head>
<body>
    <main>
        <div class="contenedor__todo">
            <div class="caja__trasera">
                <div class="caja__trasera-login">
                    <h3>¿Ya tienes una cuenta?</h3>
                    <p>Inicia Seción para entrar en la pagina</p>
                    <button id="btn__Iniciar-Secion"> Iniciar seción </button>
                </div>
                <div class="caja__trasera-Registro">
                    <h3>¿Aun no tienes una cuenta? </h3>
                    <p> Registrate para entrar en la pagina </p>
                    <button id="btn__Registrarse"> Registrarse</button>

                </div>
           </div> 
           <div class="contenedor__login-registro">
              <form action="" class="formulario__Login">
                   <h2> Inicio de secion</h2>
                   <input type=" text" placeholder="Correo Electronico">
                   <input type= "password" placeholder="Contraseña">
                   <button> Ingresar </button> 
              </form>

              <form action="" class="formulario__Registro">
                    <h2> Registrarse</h2>
                    <input type=" text" placeholder="Nombre completo">
                    <input type=" text" placeholder="Correo Electronico">
                    <input type="text" placeholder="Crear Usuario">
                    <input type="password" placeholder=" Crear Contraseña">
                    <input type="password" placeholder="Repita Contraseña">
                    <button> Registrar </button>
              </form>
 
      
            </div>
                
        </div>
    </main>
    
    <script  src="JS/Guardar.js"></script>
</body>
</html>
